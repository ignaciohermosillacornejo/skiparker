name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the sections below.

        **Tip:** You can also use `ski-parker bug` to auto-fill system info.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
      placeholder: Describe the bug...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
      placeholder: I expected...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Run `ski-parker ...`
        2. ...
        3. See error
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: ski-parker version
      description: Output of `ski-parker --version`
      placeholder: "0.2.0"
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: Output of `node --version`
      placeholder: "v20.0.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
    validations:
      required: true

  - type: input
    id: resort
    attributes:
      label: Resort URL (if applicable)
      description: Which resort were you trying to book?
      placeholder: "reservenski.parkstevenspass.com"

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Run with `--verbose` flag and paste any relevant output
      render: shell

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Any other information that might help
